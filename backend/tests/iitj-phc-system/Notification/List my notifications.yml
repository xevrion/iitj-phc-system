info:
  name: List my notifications
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8000/api/v1/notifications/mine
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
