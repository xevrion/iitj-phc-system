info:
  name: Mark notification as read
  type: http
  seq: 2

http:
  method: PUT
  url: http://localhost:8000/api/v1/notifications/NOTIFICATION_ID/read
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
