http:
  method: GET
  url: http://localhost:8000/api/v1/prescriptions/history
  headers:
    - name: Authorization
      value: Bearer PHARMACY_TOKEN
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
