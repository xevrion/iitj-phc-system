info:
  name: Pharmacy updates stock
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:8000/api/v1/medicines/MEDICINE_ID/stock
  headers:
    - name: Authorization
      value: Bearer PHARMACY_TOKEN
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "stockQuantity": 150 }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
